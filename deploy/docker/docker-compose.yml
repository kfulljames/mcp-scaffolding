# Reference compose file for local/staging use — not a production orchestrator.
# Run: docker compose -f deploy/docker/docker-compose.yml up --build
services:
  mcp-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../../.env
    environment:
      TRANSPORT: http
      PORT: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
